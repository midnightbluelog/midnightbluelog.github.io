<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240">
  <defs>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="8" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="9" xChannelSelector="R" yChannelSelector="G" result="shape"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="3" result="spots"/>
      <feColorMatrix in="spots" type="matrix" values="0 0 0 0 0.62  0 0 0 0 0.58  0 0 0 0 0.72  0 0 0 2.2 -1.15" result="tint"/>
      <feComposite in="tint" in2="shape" operator="in" result="craters"/>
      <feMerge><feMergeNode in="shape"/><feMergeNode in="craters"/></feMerge>
    </filter>
    <filter id="wash" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="22" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="9"/>
    </filter>
    <mask id="cres"><rect x="-600" y="-600" width="1200" height="1200" fill="#fff"/><circle cx="40" cy="-30" r="80" fill="#000"/></mask>
  </defs>

  <!-- the moon (organic) -->
  <g transform="translate(92 130) scale(.62)">
    <g filter="url(#wash)" opacity=".55"><circle r="118" fill="#8e7bd9" mask="url(#cres)"/></g>
    <g filter="url(#ink)"><circle r="100" fill="#f3eee6" mask="url(#cres)"/></g>
  </g>

  <!-- the constellation (tech): stars wired like a small network -->
  <g stroke="#a99bf0" stroke-width="1" stroke-opacity=".35" fill="none">
    <path d="M190 70 L250 46 L312 78 L372 52"/>
    <path d="M250 46 L268 118 L312 78"/>
    <path d="M268 118 L340 150 L372 52"/>
    <path d="M190 70 L268 118"/>
  </g>
  <g stroke="#a99bf0" stroke-width="1" stroke-opacity=".18" stroke-dasharray="2 5" fill="none">
    <path d="M150 104 L190 70"/>
    <path d="M340 150 L396 176"/>
  </g>
  <g fill="#f3eee6">
    <circle cx="190" cy="70" r="2.6"/>
    <circle cx="250" cy="46" r="3.2"/>
    <circle cx="312" cy="78" r="2.4"/>
    <circle cx="372" cy="52" r="2.8"/>
    <circle cx="340" cy="150" r="2.4"/>
    <circle cx="396" cy="176" r="1.6" opacity=".6"/>
  </g>
  <!-- the active node -->
  <circle cx="268" cy="118" r="4" fill="#ff86d4"/>
  <circle cx="268" cy="118" r="4" fill="none" stroke="#ff86d4" stroke-width="1">
    <animate attributeName="r" values="4;14" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values=".7;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <text x="280" y="126" font-family="JetBrains Mono, monospace" font-size="9" fill="#8b91b3" letter-spacing=".5">you are here</text>
</svg>
