<svg xmlns="http://www.w3.org/2000/svg" viewBox="120 130 260 260">
  <defs>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="8" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="9" xChannelSelector="R" yChannelSelector="G" result="shape"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="3" result="spots"/>
      <feColorMatrix in="spots" type="matrix" values="0 0 0 0 0.62  0 0 0 0 0.58  0 0 0 0 0.72  0 0 0 2.2 -1.15" result="tint"/>
      <feComposite in="tint" in2="shape" operator="in" result="craters"/>
      <feMerge><feMergeNode in="shape"/><feMergeNode in="craters"/></feMerge>
    </filter>
    <filter id="wash" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="22" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="9"/>
    </filter>
    <mask id="cres"><rect x="-600" y="-600" width="1200" height="1200" fill="#fff"/><circle cx="40" cy="-30" r="80" fill="#000"/></mask>
  </defs>
  <g transform="translate(250 262)" filter="url(#wash)" opacity=".55"><circle r="118" fill="#8e7bd9" mask="url(#cres)"/></g>
  <g transform="translate(250 262)" filter="url(#ink)"><circle r="100" fill="#f3eee6" mask="url(#cres)"/></g>
  <circle cx="352" cy="166" r="5" fill="#ff86d4"/>
</svg>
